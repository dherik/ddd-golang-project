services:
  app:
    container_name: app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Intentionally published on 3333 so the API stays reachable from the host
      # (curl, bruno, k6, README examples). The integration suite does NOT use
      # this port: it binds an ephemeral one via setup.ServerURL(), so the two
      # never collide. Do not remove this mapping without updating those callers.
      - "3333:3333"
    environment:
      - DB_HOST=postgres
      - BROKER_HOST=rabbitmq
    # Not "on-failure": a crash-looping container silently reclaims 3333 and
    # hides the failure it is looping on.
    restart: "no"
    depends_on:     # Add other services your app depends on (e.g., RabbitMQ)
      - postgres
      - rabbitmq

  postgres:
    image: postgres:16.2
    environment:
      POSTGRES_DB: dddtasks
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: pgpassword
    ports:
      - "5432:5432"  # Map the PostgreSQL port to a host port (optional)
    volumes:
      - ./init_ddl.sql:/docker-entrypoint-initdb.d/init_ddl.sql
      - ./init_dml.sql:/docker-entrypoint-initdb.d/init_dml.sql

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./definitions.json:/etc/rabbitmq/definitions.json:ro
    ports:
        - "5672:5672"
        - "15672:15672"